<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas recibidas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
<div class="container-fluid p-4">

  <div class="card shadow-sm border-0">
    <!-- header -->
    <div class="card-header text-white" style="background:#f88d00;">
      <i class="fa-solid fa-clipboard-list me-2"></i>Listado de consultas
    </div>

    <!-- buscador -->
    <div class="p-3 border-bottom">
      <div class="input-group w-100 w-md-25">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre o correo">
      </div>
    </div>


    <div id="loader" class="text-center py-4">
  <div class="spinner-border text-warning" role="status"></div>
  <div class="mt-2">Cargando consultas...</div>
</div>


    <!-- tabla -->
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:60px" class="text-center">#</th>
            <th>Nombre</th>
            <th>Celular</th>
            <th>Correo</th>
            <th>Tipo</th>
            <th class="text-center">Editar</th>
          </tr>
        </thead>

        <tbody id="tabla-consultas">
        </tbody>

      </table>

    </div>

  </div>
</div>


<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input id="edit-name" class="form-control mb-2" placeholder="Nombre">
        <input id="edit-celular" class="form-control mb-2" placeholder="Celular">
        <input id="edit-correo" class="form-control mb-2" placeholder="Correo">

        <!-- si ya los estás usando, déjalos -->
        <select id="edit-tipo" class="form-select mb-2">
          <option value="">Selecciona</option>
          <option value="soporte">Soporte</option>
          <option value="sugerencias">Sugerencias</option>
          <option value="reportar">Reportar</option>
          <option value="otros">Otros</option>
        </select>

        <textarea id="edit-detalle" class="form-control mb-2 d-none" rows="3"
          placeholder="Detalle (solo si es 'otros')"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
      </div>

    </div>
  </div>
</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="JS/tabla.js"></script>

</body>
</html>
