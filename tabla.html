<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas recibidas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
<div class="container-fluid p-4">

  <div class="card shadow-sm border-0">
    <!-- header -->
    <div class="card-header text-white" style="background:#f88d00;">
      <i class="fa-solid fa-clipboard-list me-2"></i>Listado de consultas
    </div>

    <!-- buscador -->
    <div class="p-3 border-bottom">
      <div class="input-group w-100 w-md-25">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" class="form-control" placeholder="Buscar por nombre o correo">
      </div>
    </div>

    <!-- tabla -->
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:60px" class="text-center">#</th>
            <th>Nombre</th>
            <th>Celular</th>
            <th>Correo</th>
            <th>Tipo</th>
            <th class="text-center">Editar</th>
          </tr>
        </thead>

        <tbody id="tabla-consultas">
        </tbody>

      </table>

    </div>

  </div>
</div>


<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Consulta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input id="edit-name" class="form-control mb-2" placeholder="Nombre">
        <input id="edit-celular" class="form-control mb-2" placeholder="Celular">
        <input id="edit-correo" class="form-control mb-2" placeholder="Correo">
                <!-- Tipo -->
        <select id="edit-tipo" class="form-select mb-2">
          <option value="soporte">Soporte</option>
          <option value="sugerencias">Sugerencias</option>
          <option value="reportar">Reportar problema</option>
          <option value="otros">Otros</option>
        </select>

        <!-- Detalle (solo si es Otros) -->
        <textarea
          id="edit-detalle"
          class="form-control d-none"
          rows="4"
          placeholder="Detalle (solo si es Otros)">
        </textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>
  obtenerBandidos();

  function obtenerBandidos() {
    fetch('http://127.0.0.1:8000/api/obtener-bandidos')
      .then(response => response.json())
      .then(data => {

        const tbody = document.getElementById('tabla-consultas');
        tbody.innerHTML = '';

        data.data.forEach((item, index) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-center">${index + 1}</td>
              <td>${item.nombre_apellido}</td>
              <td>${item.celular}</td>
              <td>${item.correo}</td>
              <td>${item.tipo_consulta ?? '-'}</td>
              
              <td class="text-center">
                
            <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="abrirEditar(${item.id}, '${item.nombre_apellido}', '${item.celular}', '${item.correo}')">
           <i class="fa-solid fa-pen-to-square"></i>
            </button>
                
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminar(${item.id})">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });

      })
      .catch(error => {
        console.error(error);
      });
  }

  function eliminar(id) {
    fetch(`http://127.0.0.1:8000/api/eliminar-bandido/${id}`, {
      method: 'DELETE'
    })
    .then(response => {
      // Check if the request was successful (e.g., status 200, 204)
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      console.log('Delete successful');
      // Many DELETE endpoints return no content (204 No Content), so response.json() might fail.


      obtenerBandidos();
    })
    .catch(error => {
      console.error('There has been a problem with your fetch operation:', error);
    });
  }


  function editar(id) {
  fetch(`http://127.0.0.1:8000/api/editar-bandido/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: 'Nombre editado',
      celular: '999999999',
      correo: `editado_${id}@email.com`,
      tipoConsulta: 'soporte',
      detalleConsulta: 'editado desde JS'
    })
  })
  .then(r => r.json())
  .then(res => {
    alert(res.mensaje || 'Actualizado');
    obtenerBandidos();
  })
  .catch(err => console.error(err));
}

let editId = null;

function abrirEditar(id, nombre, celular, correo){
  editId = id;
  document.getElementById('edit-name').value = nombre;
  document.getElementById('edit-celular').value = celular;
  document.getElementById('edit-correo').value = correo;

  new bootstrap.Modal(document.getElementById('modalEditar')).show();
}

function guardarEdicion(){
  fetch(`http://127.0.0.1:8000/api/editar-bandido/${editId}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      name: document.getElementById('edit-name').value,
      celular: document.getElementById('edit-celular').value,
      correo: document.getElementById('edit-correo').value
    })
  })
  .then(r => r.json())
  .then(() => obtenerBandidos());
}

</script>


</body>
</html>
