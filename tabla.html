<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas recibidas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
<div class="container-fluid p-4">

  <div class="card shadow-sm border-0">
    <!-- header -->
    <div class="card-header text-white" style="background:#f88d00;">
      <i class="fa-solid fa-clipboard-list me-2"></i>Listado de consultas
    </div>

    <!-- buscador -->
    <div class="p-3 border-bottom">
      <div class="input-group w-100 w-md-25">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" class="form-control" placeholder="Buscar por nombre o correo">
      </div>
    </div>

    <!-- tabla -->
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:60px" class="text-center">#</th>
            <th>Nombre</th>
            <th>Celular</th>
            <th>Correo</th>
            <th>Tipo</th>
            <th class="text-center">Editar</th>
          </tr>
        </thead>

        <tbody id="tabla-consultas">
        </tbody>

      </table>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>
  obtenerBandidos();

  function obtenerBandidos() {
    fetch('http://127.0.0.1:8000/api/obtener-bandidos')
      .then(response => response.json())
      .then(data => {

        const tbody = document.getElementById('tabla-consultas');
        tbody.innerHTML = '';

        data.data.forEach((item, index) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-center">${index + 1}</td>
              <td>${item.nombre_apellido}</td>
              <td>${item.celular}</td>
              <td>${item.correo}</td>
              <td>${item.tipo_consulta ?? '-'}</td>
              <td class="text-center">
                
                  <i class="fa-solid fa-pen-to-square me-2"></i>
                
                <button class="btn" onclick="eliminar(${item.id})">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });

      })
      .catch(error => {
        console.error(error);
      });
  }

  function eliminar(id) {
    fetch(`http://127.0.0.1:8000/api/eliminar-bandido/${id}`, {
      method: 'DELETE'
    })
    .then(response => {
      // Check if the request was successful (e.g., status 200, 204)
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      console.log('Delete successful');
      // Many DELETE endpoints return no content (204 No Content), so response.json() might fail.


      obtenerBandidos();
    })
    .catch(error => {
      console.error('There has been a problem with your fetch operation:', error);
    });
  }
</script>


</body>
</html>
